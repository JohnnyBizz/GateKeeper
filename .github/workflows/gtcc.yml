name: GTCC tests

# The Grok Trading Command Center has its own dependencies and its own
# suite. The GateKeeper workflow scopes pytest to the root tests/ directory,
# so without this job the GTCC suite would never run in CI.
on:
  push:
    paths: ['gtcc/**', '.github/workflows/gtcc.yml']
  pull_request:
    paths: ['gtcc/**', '.github/workflows/gtcc.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gtcc
    env:
      PYTHONPATH: src
      GTCC_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gtcc/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: The migration matches the models
        env:
          GTCC_DATABASE_URL: sqlite:///./ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Safety invariants hold
        run: python scripts/ci_invariants.py
