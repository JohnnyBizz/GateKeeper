name: Build GateKeeper

# Builds a standalone Windows executable on every push, so the app can be
# downloaded and double-clicked without installing Python at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV: the CI runner has no display.
          pip install numpy pandas PyYAML fastapi "uvicorn[standard]" pydantic \
                      websockets opencv-python-headless mss pytest httpx pillow
      - name: Run tests
        run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller gatekeeper.spec --noconfirm
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GateKeeper-windows
          path: dist/GateKeeper.exe
          if-no-files-found: error
