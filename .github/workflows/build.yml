name: Build GateKeeper

# Builds a standalone Windows executable on every push, so the app can be
# downloaded and double-clicked without installing Python at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV: the CI runner has no display.
          pip install numpy pandas PyYAML fastapi "uvicorn[standard]" pydantic \
                      websockets opencv-python-headless mss pytest httpx pillow \
                      pytesseract
      # The label and price-axis tests read text out of rendered screens, so
      # the OCR engine has to actually be present for them to mean anything.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Run tests
        run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      # Needed to publish the build as a release asset.
      contents: write
      # Needed to delete previous builds' artifacts. Without it the allowance
      # fills and every upload fails, including builds with nothing wrong.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      # Tesseract does the reading for the *screen fallback*: the pair name,
      # the timeframe badge, the price axis. The default source reads the
      # platform's socket and needs no OCR at all, so this is a bundled
      # convenience rather than a requirement — and a third-party package feed
      # having a bad afternoon must not be the reason nobody can download the
      # app. Retried, then skipped with a warning: the spec omits the vendor
      # directory when it is absent, and the app reports OCR as unavailable
      # rather than misbehaving without it.
      - name: Vendor Tesseract into the bundle
        shell: pwsh
        run: |
          $root = "C:\Program Files\Tesseract-OCR"
          foreach ($delay in 0, 15, 45) {
            if ($delay -gt 0) {
              Write-Host "Retrying the Tesseract install in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
            choco install tesseract --no-progress -y
            if (Test-Path $root) { break }
          }
          if (-not (Test-Path $root)) {
            Write-Warning "Tesseract could not be installed, so the build carries no bundled OCR. The feed source is unaffected; the screen fallback will not read labels."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path vendor\tesseract\tessdata | Out-Null
          Copy-Item "$root\tesseract.exe" vendor\tesseract\
          Copy-Item "$root\*.dll" vendor\tesseract\
          # English only; every label being read is an ASCII badge.
          Copy-Item "$root\tessdata\eng.traineddata" vendor\tesseract\tessdata\
      - name: Build executable
        run: pyinstaller gatekeeper.spec --noconfirm
      # A separate, temporary tool: it records what the platform's socket
      # sends so the format can be read off a sample rather than guessed at.
      - name: Build the feed recorder
        run: pyinstaller recordfeed.spec --noconfirm
      # Kept briefly on purpose. A build runs on every push and the executable
      # is a large artifact, so at the default ninety days the account's whole
      # artifact allowance fills up and *every* upload starts failing — which
      # is what happened: the tests passed, the exe built, and it simply could
      # not be stored. Long enough to download the build that prompted it,
      # short enough that the allowance keeps clearing itself.
      # Clear the previous builds before adding another. A build runs on every
      # push and the executable is large, so without this the account's whole
      # artifact allowance fills up and *every* upload starts failing — the
      # tests pass, the exe builds, and it simply cannot be stored. Retention
      # alone does not fix it, because artifacts already uploaded keep their
      # original ninety-day expiry.
      #
      # One previous build of each is kept, so there is always something
      # downloadable even if this run turns out to be broken. Never allowed to
      # fail the build: a tidying step that blocks a good executable from
      # reaching anyone would be worse than the mess it cleans up.
      - name: Make room for this build
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const KEEP = 1;
            const all = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const groups = {};
            for (const a of all) {
              if (a.expired) continue;
              (groups[a.name] ||= []).push(a);
            }
            let removed = 0, freed = 0;
            for (const [name, list] of Object.entries(groups)) {
              list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const old of list.slice(KEEP)) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: old.id,
                  });
                  removed++;
                  freed += old.size_in_bytes;
                } catch (error) {
                  core.warning(`could not delete ${name} #${old.id}: ${error.message}`);
                }
              }
            }
            core.info(
              `removed ${removed} old artifact(s), freeing ` +
              `${(freed / 1e9).toFixed(2)} GB`
            );

      # A zipped copy of each executable, to be published beside the bare one.
      #
      # Edge refused to download RecordFeed.exe outright — "couldn't download,
      # virus detected" — and a refusal at the browser is not something anyone
      # can click past: there is no file to allow, because none arrived. That
      # check reads the executable as it comes down the wire; a zip is not an
      # executable, so it arrives, and Windows then judges the file on
      # extraction, where "keep anyway" is at least offered.
      #
      # Both forms are published rather than the zip alone: when the plain
      # .exe does come through it is one click, and that is the better path
      # for anyone whose machine is not refusing it.
      - name: Zip the executables as well
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GateKeeper.exe -DestinationPath dist\GateKeeper-windows.zip -Force
          Compress-Archive -Path dist\RecordFeed.exe -DestinationPath dist\RecordFeed-windows.zip -Force

      # The download that actually has to work. Release assets are stored
      # separately from Actions artifacts, so a full artifact allowance — or
      # the six-to-twelve hours GitHub takes to notice one has been emptied —
      # cannot stop a finished build reaching anyone. It is also a stable
      # address: the same link after every push, rather than a fresh one
      # buried in whichever run happened to produce it.
      - name: Publish the build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/GateKeeper.exe dist/RecordFeed.exe \
            dist/GateKeeper-windows.zip dist/RecordFeed-windows.zip \
            --title "GateKeeper — latest build" \
            --notes "$(printf '%s\n' \
              "Built from ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC')." \
              "" \
              "**If the browser refuses the .exe** (\"couldn't download - virus detected\"), take the .zip beside it instead and extract it. These builds are not code-signed, so a brand-new unsigned executable is judged on reputation it has not had time to earn." \
              "" \
              "GateKeeper can record a chart on its own — the RECORD button on the panel — so RecordFeed.exe is only needed if you would rather run it separately.")" \
            --prerelease

      # Kept as a second copy, and no longer able to fail the build: the
      # release above is the download, and an artifact allowance problem must
      # never again be the reason a working executable reaches nobody.
      - name: Upload executable
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GateKeeper-windows
          path: dist/GateKeeper.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload the feed recorder
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RecordFeed-windows
          path: dist/RecordFeed.exe
          if-no-files-found: error
          retention-days: 7
