# Pocket Option Technical Analysis Assistant — sample configuration.
#
# Copy this file to config.yaml and edit it. Anything you leave out falls back
# to the defaults in poa/config.py. Every value can also be overridden with an
# environment variable, e.g. POA_SERVER__PORT=9000 or POA_CAPTURE__SOURCE=screen.

server:
  host: 127.0.0.1        # localhost only; this tool reads your screen
  port: 8765
  open_browser: false     # open the dashboard automatically on start

capture:
  # feed      — read the platform's own messages through the browser. Exact
  #             prices, the exact instrument and the exact timeframe, with
  #             nothing to misread. This is the one you want.
  # screen    — capture a region of your screen and read the candles with
  #             OpenCV. A fallback for platforms whose traffic cannot be read.
  # csv       — replay a recorded candle file (see capture.csv_path)
  # synthetic — generated demo data, works anywhere, good for trying the tool
  source: feed

  # The feed source attaches to a browser started with a debugging port. It
  # starts one itself, against its own profile directory, because Chrome will
  # not open that port on your everyday profile.
  debug_port: 9222
  auto_launch_browser: true
  match: pocketoption

  # The messages that name the open chart and carry its history are sent when
  # the chart loads. Attaching to a tab that loaded minutes ago misses them, so
  # the page is asked to reload — at most twice — rather than asking you to
  # switch timeframe to shake them loose. Set false to never touch the page.
  refresh_chart: true

  poll_seconds: 0.5       # how often to re-read the chart. Low is safe:
                          # the engine never starts a read sooner than the
                          # last one took, so a slow source paces itself.

  # -- screen source ---------------------------------------------------------
  # Run `python tools/select_region.py` to fill this in by dragging over your
  # chart. Select the plot area only: candles plus the price axis, and none of
  # the platform's own buttons or panels.
  region:
    left: 0
    top: 0
    width: 0
    height: 0

  monitor: 1

  # Two reference points from the chart's price axis, so pixel rows can be
  # converted into real prices. This is exact and does not break when the
  # platform changes its fonts, so prefer it over OCR.
  #
  # To fill it in: note the pixel row and the price of two horizontal
  # gridlines (select_region.py prints rows as you hover).
  calibration:
    enabled: false
    top_pixel: 0
    top_price: 0.0
    bottom_pixel: 0
    bottom_price: 0.0

  # OCR is tried when no manual calibration is set. It needs Tesseract
  # installed, and it refuses to return a calibration it cannot verify.
  ocr:
    enabled: true
    axis_width_px: 70

  # Candle colours, as HSV ranges. Defaults cover the usual green/red palettes.
  # Only set this if your chart is themed unusually and candles are being missed.
  # colors:
  #   bullish:
  #     - {low: [35, 60, 60], high: [90, 255, 255]}
  #   bearish:
  #     - {low: [0, 60, 60], high: [12, 255, 255]}
  #     - {low: [165, 60, 60], high: [180, 255, 255]}

  # -- csv source ------------------------------------------------------------
  csv_path: data/sample_eurusd_m1.csv
  csv_replay_speed: 0.0

  save_screenshots: true

market:
  asset: EUR/USD

  # The candles on your chart. Separate from trade_duration below.
  chart_timeframe: 60      # seconds — 60 = 1 minute candles

  # The expiration you intend to buy. THIS IS NOT THE CHART TIMEFRAME.
  trade_duration: 180      # seconds — 180 = a 3 minute trade

  # The higher-timeframe view is built by aggregating this many chart candles.
  higher_timeframe_multiple: 5   # 1-minute chart -> 5-minute higher view
  entry_timeframe_multiple: 1    # 1 = the chart itself is the entry view

  min_candles: 60          # below this, data quality is reported as poor
  max_candles: 600         # how much history to keep in memory

  # Chart lengths to also read the same pair at, on top of the one your chart
  # is open on. true = every length available, false = none, or a list.
  # [5, 60] is a 5 SEC chart and a 1 MIN chart — the two most people trade.
  # More lengths is not more information, it is more rows to read past.
  scan_timeframes: [5, 60]

  # Broker payout on a win, as a fraction (0.92 = 92%). Not cosmetic: it sets
  # the break-even win rate shown everywhere. 92% payout -> 52.1% break-even;
  # 80% payout -> 55.6%.
  payout: 0.92

# Stake sizing shown in the overlay's risk block. Informational only — nothing
# here places or sizes a real trade.
risk:
  balance: 1000.0          # account balance to size against
  risk_percent: 2.0        # stake as a percentage of balance

# The always-on-top overlay panel (python overlay.py).
overlay:
  x: 40                    # initial window position
  y: 80
  opacity: 0.96            # 1.0 = fully opaque
  scan_seconds: 0.6        # how long the Scan animation holds before revealing

# Bumped when a stored setting has to change on installs that already exist.
config_version: 2

signals:
  # 62 is set for RATE, not accuracy, and the difference was measured before
  # choosing it: about one call a minute per pair instead of one every two,
  # winning 66.7% in one recorded half hour and 54.8% in another. Neither beat
  # always-buy on the same entries.
  #
  # 85 was here before and nobody chose it — it was fitted to 29 calls and did
  # not survive the next batch. Raising this again is reasonable; just judge it
  # on the always-BUY line in the session report rather than on the win rate,
  # because a trending session flatters any threshold. Table in
  # data/recorded/README.md.
  min_confidence: 75              # direction score gate — an internal number
  min_shown_confidence: 62        # the number the PANEL shows must clear this
                                  # 62 is a call about once a minute per pair.
                                  # Raise it for fewer, and read the always-BUY
                                  # line in the session report either way.
  overheat_ceiling: 90            # refuse calls whose direction score reaches
                                  # this. Backwards-sounding, measured four
                                  # times: in every live session so far the
                                  # 90+ calls settled below the band beside
                                  # them (14/31/42/21% vs 54/48/44/65%).
                                  # The score maxes out when every component
                                  # agrees, and that is the most stretched
                                  # moment of the move, not the safest. 0 = off.
  loss_cooldown_minutes: 3        # after one of the tool's own calls on a
                                  # pair loses, stand that pair down this
                                  # long. Measured: removed five losses and
                                  # one win from the session that had the
                                  # chase pattern, changed nothing elsewhere.
                                  # 0 = off.
  min_payout: 0.80                # refuse charts paying under this fraction.
                                  # At 72% payout break-even is 58.1% — a bar
                                  # nothing measured here has cleared. At 92%
                                  # it is 52.1%. Unknown payouts never block.
                                  # 0 = off.
  min_duration_compatibility: 65  # duration fit needed before a direction is shown
  min_data_confidence: 70         # chart-reading confidence needed to analyse

  # Structural requirements. Every one must pass or the answer is WAIT.
  require_multi_timeframe_agreement: true
  require_heikin_ashi_confirmation: true
  min_component_agreement: 0.55   # share of scoring weight that must agree
  max_atr_percentile: 92          # refuse to signal in the top volatility decile
  resistance_proximity_atr: 0.75  # how close to a major level counts as blocked

  # Shadow strategies raced against the live one, on paper, every session.
  # Each experiment reads the same charts under its own rulebook and
  # journals its calls under its own label; none of them can reach the
  # panel, the alerts, the calibration record or the cooldown. Their race
  # standings print in every report's ledger. Omit this key for the shipped
  # roster (fade-overheat, three-minute, thirty-second, strict-85,
  # loose-70 — the expiry matching the live one doubles as a control
  # group, and the other keeps its horizon measured); set an empty
  # list [] to turn racing off; or list your own:
  #   experiments:
  #     - label: my-idea
  #       overrides: {min_shown_confidence: 80, overheat_ceiling: 88}
  #       trade_duration: 60     # optional expiry override, seconds
  #       invert: false          # true records the OPPOSITE direction
  cooldown_seconds: 15     # silence on one chart after a signal
  weakening_drop: 15              # confidence drop that marks a setup WEAKENING
  invalidation_drop: 25           # confidence drop that INVALIDATES it

alerts:
  enabled: true
  desktop_notifications: true
  sound: false
  sound_command: ""        # leave blank to auto-detect a player
  cooldown_seconds: 20     # suppress repeats of the same alert
  min_confidence: 62       # must match signals.min_shown_confidence, or the
                           # panel shows calls that never make a sound
  notify_on:
    - BUY_SIGNAL
    - SELL_SIGNAL
    - SETUP_INVALIDATED
    - SETUP_WEAKENING
    - TREND_REVERSAL
    - HIGH_VOLATILITY
    - CONFLICTING_SIGNALS
    - DATA_QUALITY

storage:
  database: storage/journal.db
  screenshot_dir: storage/screenshots
  retain_screenshots: 500

logging:
  level: INFO              # DEBUG for verbose analysis logging
  file: storage/poa.log
